# The ALSA UCM profile is driver-coupled and lives in the system-partition
# glue store.  Expose it at the standard alsa-lib location so WirePlumber/ACP
# (which do not honour ALSA_CONFIG_UCM2) find it; sirius-audio-init sets the
# env var to the same directory for alsaucm.  Idempotent; runs early in boot.
L+ /usr/share/alsa/ucm2/SE - - - - /mnt/sysmod/glue/alsa/ucm2/SE
