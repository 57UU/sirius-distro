# rmtfs needs its backing files in /var/lib/rmtfs; the partition labels are
# device-specific, so let the system partition own these links instead of
# baking them into the rootfs image.
d /var/lib/rmtfs 0755 root root -
L+ /var/lib/rmtfs/modem_fs1 - - - - /dev/disk/by-partlabel/modemst1
L+ /var/lib/rmtfs/modem_fs2 - - - - /dev/disk/by-partlabel/modemst2
L+ /var/lib/rmtfs/modem_fsc - - - - /dev/disk/by-partlabel/fsc
L+ /var/lib/rmtfs/modem_fsg - - - - /dev/disk/by-partlabel/fsg
