Syntax 4

SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice."Speaker" {
	Comment "Built-in speaker (TAS2557 on PRI MI2S)"
	Value {
		PlaybackPCM "hw:SE,0"
		PlaybackChannels 2
	}
	EnableSequence [
		cdev "hw:SE"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
	]
	DisableSequence [
		cdev "hw:SE"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off"
	]
}

SectionDevice."Mic" {
	Comment "Built-in microphones (PM660L AMIC1 + AMIC3 on INT3 MI2S TX)"
	Value {
		CapturePCM "hw:SE,1"
		CaptureChannels 2
	}
	EnableSequence [
		cdev "hw:SE"
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' on"
		cset "name='Digital DEC1 MUX' 'ADC1'"
		cset "name='Digital DEC2 MUX' 'ADC2'"
		cset "name='Analog ADC2 MUX' 'INP3'"
		cset "name='Analog ADC1 Volume' 6"
		cset "name='Analog ADC2 Volume' 6"
	]
	DisableSequence [
		cdev "hw:SE"
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' off"
		cset "name='Digital DEC1 MUX' 'ZERO'"
		cset "name='Digital DEC2 MUX' 'ZERO'"
		cset "name='Analog ADC2 MUX' 'ZERO'"
	]
}