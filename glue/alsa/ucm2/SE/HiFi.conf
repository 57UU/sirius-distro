Syntax 4

SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
}

# Built-in speaker: TAS2557 on PRI MI2S
SectionDevice."Speaker" {
	Comment "Speaker"
	Value {
		PlaybackPCM "hw:SE,0"
		PlaybackChannels 2
		PlaybackPriority 200
	}
	EnableSequence [
		cdev "hw:SE"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
	]
	DisableSequence [
		cdev "hw:SE"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off"
	]
}

# Wired headphones: PM660L HPHL + HPHR on INT0 MI2S RX (Type-C analog audio)
SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Earpiece"
	]
	Value {
		PlaybackPCM "hw:SE,2"
		PlaybackChannels 2
		PlaybackPriority 300
		JackControl "Headset Jack"
	}
	EnableSequence [
		cdev "hw:SE"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia3' on"
		cset "name='Digital RX1 MIX1 INP1' 'RX1'"
		cset "name='Digital RX1 MIX1 INP2' 'ZERO'"
		cset "name='Digital RX2 MIX1 INP1' 'RX2'"
		cset "name='Analog RDAC2 MUX' 'RX2'"
		cset "name='Analog EAR_S' 'ZERO'"
		cset "name='Analog HPHL' 'Switch'"
		cset "name='Analog HPHR' 'Switch'"
	]
	DisableSequence [
		cdev "hw:SE"
		cset "name='Analog HPHL' 'ZERO'"
		cset "name='Analog HPHR' 'ZERO'"
		cset "name='Digital RX1 MIX1 INP1' 'ZERO'"
		cset "name='Digital RX2 MIX1 INP1' 'ZERO'"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia3' off"
	]
}

# Built-in earpiece: PM660L EAR_S on INT0 MI2S RX
SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Headphones"
	]
	Value {
		PlaybackPCM "hw:SE,2"
		PlaybackChannels 2
		PlaybackPriority 100
	}
	EnableSequence [
		cdev "hw:SE"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia3' on"
		cset "name='Digital RX1 MIX1 INP1' 'RX1'"
		cset "name='Digital RX1 MIX1 INP2' 'RX2'"
		cset "name='Analog RDAC2 MUX' 'RX1'"
		cset "name='Analog HPHL' 'ZERO'"
		cset "name='Analog HPHR' 'ZERO'"
		cset "name='Analog EAR_S' 'Switch'"
	]
	DisableSequence [
		cdev "hw:SE"
		cset "name='Analog EAR_S' 'ZERO'"
		cset "name='Digital RX1 MIX1 INP1' 'ZERO'"
		cset "name='Digital RX1 MIX1 INP2' 'ZERO'"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia3' off"
	]
}

# Bottom microphone: PM660L AMIC1 on INT3 MI2S TX (mono)
SectionDevice."Mic" {
	Comment "Bottom Mic"
	Value {
		CapturePCM "hw:SE,1"
		CaptureChannels 1
	}
	EnableSequence [
		cdev "hw:SE"
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' on"
		cset "name='Digital DEC1 MUX' 'ADC1'"
		cset "name='Analog ADC1 Volume' 6"
	]
	DisableSequence [
		cdev "hw:SE"
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' off"
		cset "name='Digital DEC1 MUX' 'ZERO'"
	]
}