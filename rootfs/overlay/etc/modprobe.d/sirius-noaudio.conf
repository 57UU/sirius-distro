# sirius: sound card bringup disabled (2026-09-30).
# The DT "sound" node (compatible qcom,sdm660-sndcard) auto-loads the
# snd_soc_sm8250 machine driver via OF modalias, which creates card0
# "Xiaomi Mi 8 SE". Audio is broken on sirius, so keep the card from
# probing and keep boot/dmesg quiet. Backend Q6/ADSP firmware loading
# is untouched (modem remoteproc is a separate device).
# Re-enable: sudo rm /etc/modprobe.d/sirius-noaudio.conf && reboot
# (or: sudo modprobe snd_soc_sm8250 to probe without reboot).
blacklist snd_soc_sm8250
install snd_soc_sm8250 /bin/false