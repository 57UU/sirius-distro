Syntax 4

SectionVerb {
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice."Speaker" {
	Comment "Built-in speaker (TAS2557 on PRI MI2S)"
	Value {
		PlaybackPCM "hw:SE,0"
		PlaybackChannels 2
	}
	EnableSequence [
		cdev "hw:SE"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
	]
	DisableSequence [
		cdev "hw:SE"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off"
	]
}

SectionDevice."Mic" {
	Comment "Built-in handset mic (AMIC1/ADC1/DEC1 via INT3, mono)"
	Value {
		CapturePCM "hw:SE,0"
		CaptureChannels 1
	}
	EnableSequence [
		cdev "hw:SE"
		cset "name='Analog ADC1 Volume' 6"
		cset "name='Digital DEC1 MUX' ADC1"
		cset "name='Digital CIC1 MUX' AMIC"
		cset "name='MultiMedia1 Mixer LPI_MI2S_TX_3' on"
	]
	DisableSequence [
		cdev "hw:SE"
		cset "name='MultiMedia1 Mixer LPI_MI2S_TX_3' off"
		cset "name='Digital DEC1 MUX' ZERO"
	]
}