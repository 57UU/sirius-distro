# sirius U-Boot boot entries. Packed to /boot/extlinux/extlinux.conf
# on the system partition (p79) by build-kernel-img.sh.
# KERNEL/INITRD/FDT paths are relative to the system partition root.
TIMEOUT 10
DEFAULT sirius
MENU TITLE sirius boot

LABEL sirius
	MENU LABEL sirius Linux
	KERNEL /boot/Image
	INITRD /boot/initrd.cpio.gz
	FDT /boot/dtb/sdm710-xiaomi-sirius.dtb
	APPEND loglevel=3 root=/dev/mmcblk0p81 rootfstype=ext4 rootwait=15 rootfs_part=mmcblk0p81 sysmod_part=mmcblk0p79 persist_part=mmcblk0p68 rw consoleblank=120

LABEL sirius-verbose
	MENU LABEL sirius Linux (verbose)
	KERNEL /boot/Image
	INITRD /boot/initrd.cpio.gz
	FDT /boot/dtb/sdm710-xiaomi-sirius.dtb
	APPEND loglevel=8 earlycon=tty0 earlyprintk root=/dev/mmcblk0p81 rootfstype=ext4 rootwait=15 rootfs_part=mmcblk0p81 sysmod_part=mmcblk0p79 persist_part=mmcblk0p68 rw consoleblank=120 ignore_loglevel
