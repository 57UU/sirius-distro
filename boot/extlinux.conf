# sirius U-Boot boot entries. Packed to /boot/extlinux/extlinux.conf
# on the system partition (p79) by build-kernel-img.sh, which substitutes
# @BOOTARGS@ from boot/bootargs (same source as the EFI boot path in U-Boot).
# KERNEL/INITRD/FDT paths are relative to the system partition root.
TIMEOUT 10
DEFAULT sirius
MENU TITLE sirius boot

LABEL sirius
	MENU LABEL sirius Linux
	KERNEL /boot/Image
	INITRD /boot/initrd.cpio.gz
	FDT /boot/dtb/sdm710-xiaomi-sirius.dtb
	APPEND @BOOTARGS@

LABEL sirius-verbose
	MENU LABEL sirius Linux (verbose)
	KERNEL /boot/Image
	INITRD /boot/initrd.cpio.gz
	FDT /boot/dtb/sdm710-xiaomi-sirius.dtb
	APPEND @BOOTARGS@ loglevel=8 earlycon=tty0 earlyprintk ignore_loglevel
